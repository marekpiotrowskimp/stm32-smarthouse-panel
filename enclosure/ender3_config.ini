# PrusaSlicer configuration for Creality Ender-3 Pro
# Filament: Devil Design PLA 1.75mm Black
# Optimized settings for quality and reliability

# === PRINTER ===
printer_technology = FFF
gcode_flavor = marlin
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
nozzle_diameter = 0.4
retract_length = 5
retract_speed = 45
# Bez Z-hopu: pojedyncza śruba Z ma luz – podnoszenie i opuszczanie przy każdej
# retrakcji mogło dawać warstwy na różnej wysokości (nierówne ścianki).
retract_lift = 0
retract_layer_change = 1
wipe = 1
retract_before_wipe = 70%

# Przyspieszenia jak w oficjalnym profilu Creality (PrusaSlicer), wysyłane w G-code
machine_limits_usage = emit_to_gcode
machine_max_acceleration_extruding = 500
machine_max_acceleration_retracting = 1000
machine_max_acceleration_travel = 500
machine_max_acceleration_x = 500
machine_max_acceleration_y = 500
machine_max_acceleration_z = 100
machine_max_acceleration_e = 5000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_feedrate_z = 10
machine_max_feedrate_e = 60
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 0.4
machine_max_jerk_e = 5
default_acceleration = 500

# === TEMPERATURE (Devil Design PLA) ===
first_layer_temperature = 215
temperature = 210
first_layer_bed_temperature = 60
bed_temperature = 60

# === COOLING ===
cooling = 1
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
bridge_fan_speed = 100
disable_fan_first_layers = 3

# === LAYERS ===
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4

# === INFILL ===
fill_density = 20%
fill_pattern = gyroid
infill_every_layers = 1

# === SPEEDS (mm/s) ===
perimeter_speed = 40
small_perimeter_speed = 25
external_perimeter_speed = 25
bridge_speed = 25
bridge_flow_ratio = 0.95
infill_speed = 50
solid_infill_speed = 45
top_solid_infill_speed = 30
support_material_speed = 50
travel_speed = 150
first_layer_speed = 20

# === EXTRUSION WIDTH ===
extrusion_width = 0.45
first_layer_extrusion_width = 0.42
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45

# === SUPPORT ===
support_material = 0
support_material_auto = 0
support_material_threshold = 45

# === ADHESION ===
brim_width = 5
elefant_foot_compensation = 0.1
skirts = 3
skirt_distance = 3
skirt_height = 1

# === START G-CODE ===
start_gcode = ; Ender-3 Pro Start G-code (Devil Design PLA)\nG28 ; Home all axes\nG92 E0 ; Reset extruder\nM140 S{first_layer_bed_temperature[0]} ; Start heating bed\nM104 S{first_layer_temperature[0]} ; Start heating nozzle\nM190 S{first_layer_bed_temperature[0]} ; Wait for bed temp\nM109 S{first_layer_temperature[0]} ; Wait for nozzle temp\nG1 Z5.0 F3000 ; Move Z up\nG1 X0.1 Y20 Z0.3 F5000.0 ; Move to start\nG1 X0.1 Y200.0 Z0.3 F1500.0 E15 ; Draw line 1\nG1 X0.4 Y200.0 Z0.3 F5000.0 ; Move\nG1 X0.4 Y20 Z0.3 F1500.0 E30 ; Draw line 2\nG92 E0 ; Reset extruder\nG1 E5 F300 ; Prime extruder (kompensacja retrakcji)\nG92 E0 ; Reset extruder\nG1 Z2.0 F3000 ; Lift Z\n; Start print

# === END G-CODE ===
end_gcode = ; End G-code\nG91 ; Relative positioning\nG1 E-2 F2700 ; Retract\nG1 E-2 Z0.2 F2400 ; Retract more + raise Z\nG1 X5 Y5 F3000 ; Wipe\nG1 Z10 ; Raise Z\nG90 ; Absolute positioning\nG1 X0 Y220 F3000 ; Present print\nM106 S0 ; Fan off\nM104 S0 ; Nozzle heater off\nM140 S0 ; Bed heater off\nM84 ; Disable motors
