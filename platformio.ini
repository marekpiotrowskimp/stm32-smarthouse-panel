; Smarthouse – panel Tuya na STM32F746G-DISCO (specyfikacja: docs/SPEC.md)

[platformio]
default_envs = disco_f746ng

; Testy jednostkowe logiki niezależnej od sprzętu (pio test -e native)
[env:native]
platform = native
test_framework = unity
; test_device_keys wymaga lib/device_keys/src/device_keys.c (generowany lokalnie, poza repozytorium)
test_ignore = test_board_*, test_device_keys
lib_ignore = app_platform, app_display, tuya_client, app_storage
build_flags = -std=c11 -Wall -Wextra

; Firmware na płytkę; testy sprzętowe test_board_* uruchamiane na płytce (pio test -e disco_f746ng)
[env:disco_f746ng]
platform = ststm32
board = disco_f746ng
framework = stm32cube
extra_scripts = pre:scripts/cube_middleware.py
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
test_framework = unity
test_filter = test_board_*
test_speed = 115200
lib_deps = lvgl/lvgl@9.2.2
build_flags = -Wall -Wextra -DLV_CONF_INCLUDE_SIMPLE
